# Feature Map — tasks read by specrun (authored; specrun never writes this file, task status
# lives in events.jsonl). Task ids FM-n, in dependency order.
# needs: tasks that must be done first (their notes go into the prompt); `all` = every other task.
# model: strong for tasks that need the stronger model, default otherwise (may be omitted).
# size: S · M · L — the expected turns and cost (config `sizes`).
# Strong tasks: FM-1 adds a config field and the parsing every later task and check relies on.

title: Feature Map
tasks:
  - id: FM-1
    phase: 1
    title: 'Feature map loader: config, schema, mermaid nodes'
    needs: []
    model: strong
    size: M
  - id: FM-2
    phase: 1
    title: specrun features check and task features field
    needs: [FM-1]
    size: M
  - id: FM-3
    phase: 1
    title: 'feature-map skill: standard and templates'
    needs: [FM-2]
    size: M
  - id: FM-4
    phase: 1
    title: Map in planning, write-spec upkeep, review pitfalls
    needs: [FM-3]
    size: M
